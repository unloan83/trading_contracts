[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trading_contracts"
version = "0.1.0"
description = "Immutable Pydantic v2 schemas for trading signals, market state, and risk decisions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
]
